services:
  gateway:
    build: ./gateway
    ports:
      - "8443:8443"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
      POOL_SIZE: "1"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      FLAG_PART1: "WRECKIT70{flag_part1_placeholder}"
      ADMIN_SEED_FLAG_PART2: "WRECKIT70{flag_part2_placeholder}"
      ADMIN_PASSWORD: "relay-internal-only"
    expose:
      - "8080"

  bot:
    build: ./bot
    environment:
      APP_URL: "http://gateway:8443"
      VISIT_INTERVAL_MS: "15000"
      ADMIN_PASSWORD: "relay-internal-only"
    depends_on:
      - gateway
    restart: unless-stopped
